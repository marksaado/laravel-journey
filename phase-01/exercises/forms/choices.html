<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Order coffee</title>
  </head>
  <body>
    <h1>Order coffee</h1>
    <form>
      <fieldset>
        <legend>Coffee size</legend>

        <input type="radio" name="size" id="size_small" value="small" />
        <label for="size_small">Small</label>

        <input
          type="radio"
          name="size"
          id="size_medium"
          value="medium"
          checked
        />
        <label for="size_medium">Medium</label>

        <input type="radio" name="size" id="size_large" value="large" />
        <label for="size_large">Large</label>
      </fieldset>

      <button>Order</button>
    </form>
  </body>
</html>
