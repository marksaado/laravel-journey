<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Log in</title>
  </head>
  <body>
    <h1>Log in</h1>

    <form method="post">
      <label for="email">Email</label>
      <input type="email" name="email" id="email" required />

      <label for="password">Password</label>
      <input
        type="password"
        name="password"
        id="password"
        required
        minlength="8"
      />

      <button>Log in</button>
    </form>
  </body>
</html>
