<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Create your Twente Sports Club account to choose your membership, select your sports interests, and manage your training preferences."
    />
    <title>Create account | Twente Sports Club</title>
  </head>
  <body>
    <header>
      <h1>Twente Sports Club</h1>
    </header>

    <main>
      <h2>Create your account</h2>

      <form method="post">
        <fieldset>
          <legend>Personal details</legend>

          <label for="full_name">Full name</label>
          <input
            type="text"
            name="full_name"
            id="full_name"
            required
            minlength="2"
          />

          <label for="email">Email</label>
          <input type="email" name="email" id="email" required />

          <label for="phone">Phone</label>
          <input type="tel" name="phone" id="phone" />

          <label for="birth_date">Birth date</label>
          <input type="date" name="birth_date" id="birth_date" required />
        </fieldset>

        <fieldset>
          <legend>Account</legend>

          <label for="password">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            required
            minlength="8"
          />
        </fieldset>

        <fieldset>
          <legend>Membership</legend>

          <input
            type="radio"
            name="membership"
            id="membership_basic"
            value="basic"
            checked
          />
          <label for="membership_basic">Basic</label>

          <input
            type="radio"
            name="membership"
            id="membership_plus"
            value="plus"
          />
          <label for="membership_plus">Plus</label>

          <input
            type="radio"
            name="membership"
            id="membership_premium"
            value="premium"
          />
          <label for="membership_premium">Premium</label>
        </fieldset>

        <fieldset>
          <legend>Interests</legend>

          <input
            type="checkbox"
            name="interests"
            id="interest_football"
            value="football"
          />
          <label for="interest_football">Football</label>

          <input
            type="checkbox"
            name="interests"
            id="interest_tennis"
            value="tennis"
          />
          <label for="interest_tennis">Tennis</label>

          <input
            type="checkbox"
            name="interests"
            id="interest_swimming"
            value="swimming"
          />
          <label for="interest_swimming">Swimming</label>
        </fieldset>

        <fieldset>
          <legend>Training</legend>

          <label for="day">Preferred day</label>
          <select name="day" id="day">
            <option value="monday">Monday</option>
            <option value="tuesday">Tuesday</option>
            <option value="wednesday" selected>Wednesday</option>
            <option value="thursday">Thursday</option>
            <option value="friday">Friday</option>
          </select>

          <label for="hours">Hours per week</label>
          <input type="number" name="hours" id="hours" min="1" max="20" />

          <label for="notes">Anything we should know?</label>
          <textarea name="notes" id="notes" rows="4"></textarea>
        </fieldset>

        <input type="checkbox" name="terms" id="terms" value="yes" required />
        <label for="terms">I agree to the club rules</label>

        <button>Create account</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Twente Sports Club</p>
    </footer>
  </body>
</html>
